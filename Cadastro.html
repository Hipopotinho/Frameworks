<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
    
      .container {
        background: rgba(255, 255, 255, 0.9);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      h1 {
        text-align: center;
        margin-bottom: 0.5rem;
      }
      p {
        text-align: center;
        color: #6b7280;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 1rem;
      }
      label span {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
        color: #374151;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: #6b7280;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #111827;
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .social {
        margin-top: 1rem;
        text-align: center;
      }
      .social button {
        background: white;
        border: 1px solid #d1d5db;
        color: #374151;
        margin: 0.25rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Área de Cadastro -->
    <div class="container">
      <h1>Criar conta</h1>
      <p>Preencha os dados abaixo</p>
      <!-- aqui está a mudança: form com action -->
      <form action="login.html" method="get">
        <label>
          <span>Nome completo</span>
          <input type="text" placeholder="Seu nome" required />
        </label>
        <label>
          <span>E-mail</span>
          <input type="email" placeholder="seu@exemplo.com" required />
        </label>
        <label>
          <span>Senha</span>
          <input type="password" placeholder="Mínimo 6 caracteres" required />
        </label>
        <label>
          <span>Confirmar senha</span>
          <input type="password" placeholder="Repita sua senha" required />
        </label>
        <button type="submit">Cadastrar</button>
      </form>
  </body>
</html>
