<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #bae6fd);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }

      .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background-color: #cbd5e1;
        margin: 0 auto 1rem auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #64748b;
      }

      h1 {
        margin: 0.5rem 0;
        color: #0f172a;
      }

      p {
        margin: 0.25rem 0 1.5rem 0;
        color: #334155;
        font-size: 0.95rem;
      }

      button {
        width: 100%;
        padding: 0.6rem;
        background: #0f172a;
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
        margin: 0.5rem 0;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile-pic">👤</div>
      <h1>João da Silva</h1>
      <p>joao.silva@email.com</p>

      <button onclick="window.location.href='AlterarSenha.html'">
        Alterar senha
      </button>
      <button onclick="window.location.href='login.html'">Sair</button>
    </div>
  </body>
</html>
]
