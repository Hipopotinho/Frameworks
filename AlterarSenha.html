<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alterar Senha</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
        color: #047857;
      }
      p {
        margin-bottom: 1.5rem;
        color: #065f46;
        font-size: 0.9rem;
      }
      label {
        display: block;
        margin-bottom: 1rem;
        text-align: left;
      }
      label span {
        display: block;
        margin-bottom: 0.25rem;
        color: #065f46;
        font-size: 0.85rem;
      }
      input[type="password"] {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: #047857;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #047857;
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 1rem;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Alterar Senha</h1>
      <p>Insira sua nova senha abaixo</p>
      <form action="home.html" method="get">
        <label>
          <span>Nova senha</span>
          <input type="password" placeholder="Digite a nova senha" required />
        </label>
        <label>
          <span>Confirmar nova senha</span>
          <input type="password" placeholder="Repita a nova senha" required />
        </label>
        <button type="submit">Alterar senha</button>
      </form>
    </div>
  </body>
</html>
