<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 2rem;
        gap: 2rem;
      }

      header {
        width: 100%;
        max-width: 800px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 1rem 2rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }

      header h1 {
        margin: 0;
        font-size: 1.5rem;
        color: #111827;
      }

      main {
        width: 100%;
        max-width: 800px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }

      .card {
        background: white;
        padding: 1.5rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }

      .card h2 {
        margin: 0 0 0.5rem 0;
        color: #111827;
      }

      .card p {
        margin: 0;
        color: #374151;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Home</h1>
    </header>

    <main>
      <div class="card" onclick="window.location.href='perfil.html'">
        <h2>Perfil</h2>
        <p>Visualize suas informações</p>
      </div>

      <div class="card" onclick="window.location.href='alterarsenha.html'">
        <h2>Alterar Senha</h2>
        <p>Modifique sua senha de acesso</p>
      </div>
      <div class="card" onclick="window.location.href='logout.html'">
        <h2>Logout</h2>
        <p>Sair da aplicação</p>
      </div>
    </main>
  </body>
</html>
