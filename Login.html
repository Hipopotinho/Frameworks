<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      h1 {
        text-align: center;
        margin-bottom: 0.5rem;
      }
      p {
        text-align: center;
        color: #6b7280;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 1rem;
      }
      label span {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
        color: #374151;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: #6b7280;
      }
      .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }
      .options a {
        color: #374151;
        text-decoration: none;
      }
      .options a:hover {
        text-decoration: underline;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #111827;
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .social {
        margin-top: 1rem;
        text-align: center;
      }
      .social button {
        background: white;
        border: 1px solid #d1d5db;
        color: #374151;
        margin: 0.25rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .footer {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.85rem;
        color: #6b7280;
      }
      .footer a {
        color: #111827;
        text-decoration: none;
        font-weight: 600;
      }
      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Entrar na sua conta</h1>
      <p>Acesse com seu e-mail e senha</p>
      <form id="loginForm">
        <label>
          <span>E-mail</span>
          <input
            type="email"
            id="email"
            placeholder="seu@exemplo.com"
            required
          />
        </label>
        <label>
          <span>Senha</span>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </label>
        <div class="options">
          <label><input type="checkbox" /> Lembrar-me</label>
          <a href="recuperarsenha.html">Esqueci a senha</a>
        </div>
        <button type="submit">Entrar</button>
      </form>

      <div class="social">
        <p style="margin: 0.75rem 0; color: #6b7280; font-size: 0.85rem">
          ou entre com
        </p>
        <button>Google</button>
        <button>GitHub</button>
      </div>

      <div class="footer">
        Não tem conta? <a href="cadastro.html">Cadastre-se</a>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          if (email && password) {
            alert("Login realizado com sucesso!");
            window.location.href = "home.html";
          } else {
            alert("Preencha o e-mail e a senha corretamente.");
          }
        });
    </script>
  </body>
</html>
