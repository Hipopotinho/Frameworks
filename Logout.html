<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logout</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }

      h1 {
        font-size: 3rem;
        color: #b91c1c;
        margin-bottom: 0.5rem;
      }

      p {
        color: #991b1b;
        margin-bottom: 2rem;
        font-size: 1rem;
      }

      button {
        width: 100%;
        padding: 0.6rem;
        background: #b91c1c;
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Até logo!</h1>
      <p>Você foi desconectado com sucesso.</p>
      <button onclick="window.location.href='login.html'">
        Voltar ao Login
      </button>
    </div>
  </body>
</html>
